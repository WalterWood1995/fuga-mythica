const NODES = [["s1", "① 骨架", "辅音是身份证"], ["s2", "② 换元音", ""], ["s3", "③ 换辅音", ""], ["s4", "④ 加前缀", "前缀会跟着辅音变形"],
               ["s5", "⑤ 加后缀", "后缀决定词性"], ["s6", "⑥ 复合", ""], ["s7", "⑦ 串成一条", ""]];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function render(code) {
  const d = L[code];
  document.title = d.name + "造词全景图";
  document.querySelectorAll("#tabs .pill").forEach(b => b.classList.toggle("on", b.dataset.l === code));
  const nodes = NODES.map(n => n.slice());
  nodes[1][2] = d.vowel.title.split(":")[1] || d.vowel.title;
  nodes[2][2] = d.cons.title.split(":")[1] || d.cons.title;
  nodes[5][2] = d.comp.rows[0][0];
  nodes[6][2] = d.chain.title;
  const maxP = Math.max(...d.pre.map(p => p[1])), maxS = Math.max(...d.suf.map(p => p[1]));
  document.getElementById("page").innerHTML = `
  <h1>${d.flag} ${d.name}怎么造词</h1>
  <p class="lead">${d.intro}</p>
  <div class="map">${svg(d, nodes)}</div>

  <h2 id="s1">① 骨架:辅音是身份证,元音只是衣服</h2>
  <div class="card"><table><tr><th>骨架</th><th>一族词</th><th>说明</th></tr>
    ${d.skel.map(r => `<tr><td class="k">${r[0]}</td><td>${r[1]}</td><td class="hint">${r[2]}</td></tr>`).join("")}</table>
    <p class="hint">查一个陌生词:先削掉认得的前后缀,剩下的抹掉元音,只看辅音去找熟悉的骨架。</p></div>

  <h2 id="s2">② ${d.vowel.title}</h2>
  <div class="card"><p style="margin-top:0">${d.vowel.why}</p><table>
    ${d.vowel.rows.map(r => `<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>

  <h2 id="s3">③ ${d.cons.title}</h2>
  <div class="card"><p style="margin-top:0">${d.cons.why}</p><table>
    ${d.cons.rows.map(r => `<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>

  <h2 id="s4">④ 加前缀:方向与态度</h2>
  <div class="card"><table><tr><th>前缀</th><th>意思</th><th>本库词数</th><th style="width:30%"></th></tr>
    ${d.pre.map(p => `<tr><td class="k">${p[0]}</td><td>${p[2]}</td><td class="n">${p[1]}</td><td><div class="bar" style="width:${Math.round(p[1] / maxP * 100)}%"></div></td></tr>`).join("")}</table>
    <p class="hint">括号里是同化形式,词数已合并。前 5 个前缀就覆盖了带前缀词的大半——先吃这几个最划算。</p></div>

  <h2 id="s5">⑤ 加后缀:决定词性</h2>
  <div class="card"><table><tr><th>后缀</th><th>意思</th><th>本库词数</th><th style="width:30%"></th></tr>
    ${d.suf.map(p => `<tr><td class="k">${p[0]}</td><td>${p[2]}</td><td class="n">${p[1] || "—"}</td><td>${p[1] ? `<div class="bar" style="width:${Math.round(p[1] / maxS * 100)}%"></div>` : ""}</td></tr>`).join("")}</table>
    <p class="hint">后缀可以叠:形容词后缀后面再接名词后缀(-al → -ality,-ive → -ivity),每叠一层换一次词性。</p></div>

  <h2 id="s6">⑥ 复合</h2>
  <div class="card"><p style="margin-top:0">${d.comp.lead}</p><table>
    ${d.comp.rows.map(r => `<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>

  <h2 id="s7">⑦ 一条完整的故事:${d.chain.title}</h2>
  <div class="card">${d.chain.steps.map((c, i) => `<div class="step"><div class="i">${i + 1}</div><div>
     <div class="op">${c[0]}</div><div class="w">${c[1]}</div>${c[2] ? `<div class="hint">${c[2]}</div>` : ""}</div></div>`).join("")}</div>

  <div class="card"><h3 style="margin-top:0">这张图对应的数据</h3>
    <p style="margin:0" class="hint">本词库${d.name} ${d.stat.words} 个单词、${d.stat.fam} 个词根家族。逐词的前缀 / 词根 / 后缀拆分见 Excel《${d.name}构词分析》表「1」。</p></div>`;
  try { history.replaceState(null, "", "?lang=" + code); localStorage.setItem("wordmap-lang", code); } catch (e) { }
  scrollTo(0, 0);
}
function svg(d, nodes) {
  const W = 880, rowH = 62, top = 30, H = top + nodes.length * rowH + 10;
  const cy = H / 2, bx = 360, bw = 470, bh = 46;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${d.name}造词全景图">`;
  s += `<rect class="n-box core" x="24" y="${cy - 40}" width="252" height="80" rx="16"/>`;
  s += `<text class="big" x="150" y="${cy - 8}" text-anchor="middle">${d.flag} ${d.name}怎么造词</text>`;
  s += `<text class="s" x="150" y="${cy + 14}" text-anchor="middle">一个骨架 + 六种动作</text>`;
  s += `<text class="s" x="150" y="${cy + 32}" text-anchor="middle">${d.stat.words} 个词 · ${d.stat.fam} 个词根家族</text>`;
  nodes.forEach((n, i) => {
    const y = top + i * rowH + bh / 2;
    s += `<path class="link" d="M276 ${cy} C 320 ${cy}, 320 ${y}, ${bx} ${y}"/>`;
    s += `<g onclick="document.getElementById('${n[0]}').scrollIntoView({behavior:'smooth'})">`;
    s += `<rect class="n-box" x="${bx}" y="${y - bh / 2}" width="${bw}" height="${bh}" rx="12"/>`;
    s += `<text class="t" x="${bx + 16}" y="${y - 2}">${n[1]}</text>`;
    s += `<text class="s" x="${bx + 16}" y="${y + 15}">${esc(n[2]).slice(0, 44)}</text></g>`;
  });
  return s + `</svg>`;
}
document.getElementById("tabs").innerHTML = Object.keys(L).map(k =>
  `<button class="pill" data-l="${k}">${L[k].flag} ${L[k].name}</button>`).join(" ");
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) render(b.dataset.l); });
let start = new URLSearchParams(location.search).get("lang");
if (!L[start]) { try { start = localStorage.getItem("wordmap-lang"); } catch (e) { } }
render(L[start] ? start : "la");
</script>
