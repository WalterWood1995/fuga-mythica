<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuga Mythica — 神话密室逃脱</title>
<style>
  :root {
    --bg: #1a1626;
    --panel: #2a2440;
    --panel2: #352d52;
    --gold: #e8b64c;
    --gold-dim: #a8842e;
    --text: #f0e9d8;
    --text-dim: #b0a890;
    --accent: #7ec8e3;
    --good: #7ede8a;
    --bad: #e37e7e;
    --parch: #e6d5a8;
    --parch2: #d4bd85;
    --ink: #5a4526;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Georgia", "Songti SC", "SimSun", serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  #app { width: 100%; max-width: 960px; padding: 12px; }

  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; gap: 8px; flex-wrap: wrap; }
  #topbar .title { font-size: 1.1em; color: var(--gold); letter-spacing: 2px; cursor: pointer; }
  .pill {
    background: var(--panel); border: 1px solid var(--gold-dim); color: var(--text);
    border-radius: 20px; padding: 5px 14px; cursor: pointer; font-size: 0.9em; font-family: inherit;
  }
  .pill:hover { background: var(--panel2); }

  .screen { display: none; animation: fadein .4s; }
  .screen.show { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  /* title */
  #screen-title { text-align: center; padding: 40px 10px; }
  #screen-title h1 { font-size: 2.6em; color: var(--gold); letter-spacing: 6px; margin-bottom: 6px; text-shadow: 0 0 30px rgba(232,182,76,.35); }
  #screen-title .subtitle { color: var(--text-dim); margin-bottom: 30px; font-size: 1.1em; }
  .big-btn {
    display: inline-block; background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    color: #221; font-size: 1.15em; padding: 13px 42px; border-radius: 30px;
    border: none; cursor: pointer; font-family: inherit; letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(232,182,76,.3); margin: 8px;
  }
  .big-btn:hover { transform: translateY(-2px); }
  .backlink { color: var(--text-dim); cursor: pointer; text-decoration: underline; font-size: .9em; }

  /* mode */
  .mode-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .mode-card {
    background: var(--panel); border: 2px solid var(--gold-dim); border-radius: var(--radius);
    padding: 24px; width: 260px; cursor: pointer; text-align: center;
  }
  .mode-card:hover { border-color: var(--gold); background: var(--panel2); transform: translateY(-3px); }
  .mode-card .emoji { font-size: 3em; }
  .mode-card h3 { color: var(--gold); margin: 10px 0 6px; }
  .mode-card p { color: var(--text-dim); font-size: 0.9em; line-height: 1.5; }

  /* ===== map ===== */
  #map-wrap { border-radius: var(--radius); overflow: hidden; border: 3px solid #7a5c30; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  #map-wrap svg { display: block; width: 100%; height: auto; }
  .map-node { cursor: pointer; }
  .map-node.locked { cursor: not-allowed; }
  .map-node text.icon { pointer-events: none; }
  @keyframes nodepulse { 0%,100% { r: 26; } 50% { r: 31; } }
  .node-current-ring { animation: nodepulse 1.8s infinite; }
  #map-legend { display: flex; gap: 18px; color: var(--text-dim); font-size: .85em; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  #map-status { text-align: center; color: var(--gold); margin-top: 10px; font-size: 1.05em; }

  /* ===== chapter ===== */
  #chapter-art-wrap { position: relative; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--gold-dim); background: #000; }
  #chapter-art-wrap img { display: block; width: 100%; max-height: 340px; object-fit: cover; object-position: center 20%; }
  #chapter-art-caption { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #ddd; font-size: .8em; padding: 26px 14px 8px; font-style: italic; }
  #chapter-title { color: var(--gold); font-size: 1.5em; letter-spacing: 2px; margin: 14px 0 8px; }
  #chapter-story { background: var(--panel); border-left: 4px solid var(--gold); border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; line-height: 1.8; margin-bottom: 16px; }
  #level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .level-btn {
    background: var(--panel); border: 2px solid var(--gold-dim); border-radius: 10px; color: var(--text);
    padding: 12px 10px; cursor: pointer; font-family: inherit; text-align: left; font-size: .92em; line-height: 1.45;
  }
  .level-btn:hover { border-color: var(--gold); background: var(--panel2); }
  .level-btn .lv-state { font-size: 1.2em; }
  .level-btn.done { border-color: var(--good); }
  .level-btn.locked { opacity: .4; cursor: not-allowed; }
  .level-btn.boss { border-color: #c46a6a; }

  /* ===== quiz ===== */
  #quiz-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 10px; flex-wrap: wrap; gap: 8px; }
  #quiz-title { color: var(--gold); font-size: 1.2em; }
  #locks { font-size: 1.15em; letter-spacing: 2px; word-break: break-all; }
  #quiz-art-wrap { position: relative; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--gold-dim); margin-bottom: 12px; background: #000; }
  #quiz-art-wrap img { display: block; width: 100%; max-height: 230px; object-fit: cover; object-position: center 25%; }
  #quiz-art-caption { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #ddd; font-size: .78em; padding: 24px 12px 7px; font-style: italic; }
  #quiz-story {
    background: var(--panel); border-left: 4px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0;
    padding: 12px 16px; line-height: 1.7; margin-bottom: 14px; font-size: .95em; color: var(--text-dim);
  }
  #quiz-card {
    background: var(--panel); border: 2px solid var(--gold); border-radius: var(--radius);
    padding: 26px 22px; text-align: center;
  }
  #q-prompt-label { color: var(--text-dim); font-size: .9em; margin-bottom: 6px; }
  #q-prompt { font-size: 2em; color: var(--accent); font-style: italic; margin-bottom: 20px; }
  #q-prompt.plain { font-style: normal; color: var(--text); }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .opt-btn {
    background: var(--panel2); border: 2px solid var(--gold-dim); color: var(--text);
    border-radius: 10px; padding: 14px 10px; font-size: 1.05em; cursor: pointer;
    font-family: inherit; text-align: center; line-height: 1.4;
  }
  .opt-btn .opt-emoji { font-size: 1.7em; display: block; }
  .opt-btn:hover { border-color: var(--gold); background: #40376a; }
  .opt-btn.correct { border-color: var(--good); background: rgba(126,222,138,.15); }
  .opt-btn.wrong { border-color: var(--bad); background: rgba(227,126,126,.15); animation: shake .35s; }
  .opt-btn:disabled { pointer-events: none; }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  #q-feedback { min-height: 30px; margin-top: 14px; font-size: 1.05em; }
  #q-feedback.good { color: var(--good); }
  #q-feedback.bad { color: var(--bad); }
  #quiz-bottom { margin-top: 12px; display: flex; justify-content: space-between; }

  /* ===== level complete ===== */
  #screen-victory { text-align: center; padding: 30px 10px; }
  #screen-victory h2 { color: var(--gold); font-size: 1.9em; margin: 8px 0 12px; }
  #screen-victory p { color: var(--text-dim); margin-bottom: 18px; line-height: 1.7; max-width: 640px; margin-left: auto; margin-right: auto; }
  #victory-words { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .word-tag { background: var(--panel2); border: 1px solid var(--gold-dim); border-radius: 16px; padding: 5px 12px; font-size: .9em; }
  .word-tag i { color: var(--accent); }

  /* ===== codex ===== */
  #codex-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  #codex-search {
    background: var(--panel); border: 1px solid var(--gold-dim); color: var(--text);
    border-radius: 20px; padding: 7px 16px; font-family: inherit; font-size: .95em; width: 220px;
  }
  #codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; margin-top: 14px; }
  .codex-card { background: var(--panel); border: 1px solid var(--gold-dim); border-radius: var(--radius); padding: 13px; text-align: center; }
  .codex-card .emoji { font-size: 2em; }
  .codex-card .latin { color: var(--accent); font-size: 1.15em; font-style: italic; margin: 3px 0; }
  .codex-card .meaning { font-size: 0.92em; }
  .codex-card .deriv { color: var(--text-dim); font-size: 0.78em; margin-top: 5px; line-height: 1.4; }
  .codex-card.locked { opacity: .3; filter: grayscale(1); }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #221; padding: 12px 26px; border-radius: 30px;
    font-size: 1em; z-index: 90; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 90vw;
  }
  #toast.show { display: block; animation: toastup 2.8s forwards; }
  @keyframes toastup {
    0% { opacity: 0; transform: translate(-50%, 20px); }
    12% { opacity: 1; transform: translate(-50%, 0); }
    80% { opacity: 1; } 100% { opacity: 0; }
  }
  footer { color: #555; font-size: .75em; padding: 18px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title" id="btn-title">⚱ FUGA MYTHICA</span>
    <span>
      <button class="pill" id="btn-lang">EN</button>
      <button class="pill" id="btn-map">🗺️ <span data-t="map">地图</span></button>
      <button class="pill" id="btn-codex">📖 <span data-t="codex">词汇册</span></button>
    </span>
  </div>

  <div class="screen" id="screen-title">
    <h1>FUGA MYTHICA</h1>
    <div class="subtitle" data-t="tagline">希腊神话密室逃脱 · 在冒险中学拉丁语</div>
    <button class="big-btn" id="btn-start" data-t="start">开始冒险</button>
    <div style="margin-top:10px"><span class="backlink" id="btn-reset" data-t="reset">清除进度重新开始</span></div>
  </div>

  <div class="screen" id="screen-mode">
    <h2 style="text-align:center;color:var(--gold);margin-top:20px" data-t="choosemode">选择你的身份</h2>
    <div class="mode-cards">
      <div class="mode-card" data-mode="apprentice">
        <div class="emoji">🐣</div><h3 data-t="apprentice">学徒 Discipulus</h3>
        <p data-t="apprenticedesc">适合 6–8 岁:看图选词,三选一,轻松闯关。</p>
      </div>
      <div class="mode-card" data-mode="hero">
        <div class="emoji">⚔️</div><h3 data-t="hero">英雄 Heros</h3>
        <p data-t="herodesc">适合 9–12 岁:双向翻译,四选一,更考记忆。</p>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-map">
    <div id="map-wrap"></div>
    <div id="map-status"></div>
    <div id="map-legend"></div>
  </div>

  <div class="screen" id="screen-chapter">
    <div id="chapter-art-wrap"><img id="chapter-art" alt="" referrerpolicy="no-referrer"><div id="chapter-art-caption"></div></div>
    <div id="chapter-title"></div>
    <div id="chapter-story"></div>
    <div id="level-grid"></div>
    <div style="margin-top:14px"><span class="backlink" id="btn-back-map" data-t="backmap">← 返回地图</span></div>
  </div>

  <div class="screen" id="screen-quiz">
    <div id="quiz-head">
      <span id="quiz-title"></span>
      <span id="locks"></span>
    </div>
    <div id="quiz-art-wrap" style="display:none"><img id="quiz-art" alt="" referrerpolicy="no-referrer"><div id="quiz-art-caption"></div></div>
    <div id="quiz-story"></div>
    <div id="quiz-card">
      <div id="q-prompt-label"></div>
      <div id="q-prompt"></div>
      <div class="options" id="q-options"></div>
      <div id="q-feedback"></div>
    </div>
    <div id="quiz-bottom">
      <span class="backlink" id="btn-quit-quiz" data-t="quit">放弃本次挑战</span>
    </div>
  </div>

  <div class="screen" id="screen-victory">
    <div style="font-size:3.6em" id="victory-emoji">🎉</div>
    <h2 id="victory-title"></h2>
    <p id="victory-text"></p>
    <div id="victory-words"></div>
    <button class="big-btn" id="btn-victory-next"></button>
  </div>

  <div class="screen" id="screen-codex">
    <div id="codex-head">
      <h2 style="color:var(--gold)">📖 <span data-t="codextitle">词汇册 Codex Verborum</span> <span id="codex-count" style="font-size:.7em;color:var(--text-dim)"></span></h2>
      <input id="codex-search" placeholder="搜索…">
    </div>
    <div id="codex-grid"></div>
  </div>
</div>

<div id="toast"></div>
<footer>Fuga Mythica · v0.2</footer>

<script src="data.js"></script>
<script>
/* ===================== I18N ===================== */
const I18N = {
  zh: {
    map: "地图", codex: "词汇册", tagline: "希腊神话密室逃脱 · 在冒险中学拉丁语",
    start: "开始冒险", reset: "清除进度重新开始", choosemode: "选择你的身份",
    apprentice: "学徒 Discipulus", apprenticedesc: "适合 6–8 岁:看图选词,三选一,轻松闯关。",
    hero: "英雄 Heros", herodesc: "适合 9–12 岁:双向翻译,四选一,更考记忆。",
    codextitle: "词汇册 Codex Verborum", backmap: "← 返回地图", quit: "放弃本次挑战",
    correct: "✨ 正确!Optime!", wrong: "不对哦,这个词等会儿还会再来!",
    q_la2m: "这个拉丁词是什么意思?", q_m2la: "它的拉丁语是哪个?",
    locksLeft: "还剩", locksUnit: "把锁",
    lvComplete: "逃出此关!", chComplete: "整章通关!", wordsGot: "本级收入词汇册的单词:",
    nextLevel: "继续下一级", backChapter: "返回章节", backMapBtn: "回到地图",
    locked: "🔒 前面的关卡还没解开!", building: "🚧 这一关正在建造中,敬请期待!",
    mapStatus: (c,l)=>`当前进度:第 ${c} 关 · 第 ${l} 级`,
    legendDone: "✅ 已通关", legendCur: "⚔️ 当前位置", legendLock: "🔒 未解锁",
    confirmReset: "确定要清除所有进度吗?", searchPh: "搜索拉丁词或释义…",
    bossTag: "关底挑战", replayTag: "可重玩",
  },
  en: {
    map: "Map", codex: "Codex", tagline: "A Greek-myth escape room · Learn Latin by adventure",
    start: "Start Adventure", reset: "Reset progress", choosemode: "Choose your path",
    apprentice: "Apprentice · Discipulus", apprenticedesc: "Ages 6–8: pictures & words, 3 choices, relaxed.",
    hero: "Hero · Heros", herodesc: "Ages 9–12: both directions, 4 choices, memory test.",
    codextitle: "Codex Verborum", backmap: "← Back to map", quit: "Give up this attempt",
    correct: "✨ Correct! Optime!", wrong: "Not quite — this word will return!",
    q_la2m: "What does this Latin word mean?", q_m2la: "Which is the Latin word for it?",
    locksLeft: "", locksUnit: "locks left",
    lvComplete: "Escaped!", chComplete: "Chapter complete!", wordsGot: "Words added to your Codex:",
    nextLevel: "Next level", backChapter: "Back to chapter", backMapBtn: "Back to map",
    locked: "🔒 Finish the earlier stages first!", building: "🚧 This chapter is under construction!",
    mapStatus: (c,l)=>`Progress: Chapter ${c} · Level ${l}`,
    legendDone: "✅ Done", legendCur: "⚔️ You are here", legendLock: "🔒 Locked",
    confirmReset: "Reset all progress?", searchPh: "Search Latin or meaning…",
    bossTag: "Boss", replayTag: "replay",
  }
};

/* ===================== STATE ===================== */
const SAVE_KEY = "fuga-mythica-save-v2";
let state = { lang: "zh", mode: null, chapter: 0, level: 0, words: [] };
/* chapter/level = the NEXT one to play (0-based). */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) Object.assign(state, s); } catch (e) {}
}
function t(k) { const v = I18N[state.lang][k]; return v === undefined ? k : v; }
function L(o) { return o[state.lang] || o.zh; }
const $ = s => document.querySelector(s);
function showScreen(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("show")); $("#"+id).classList.add("show"); }
function applyI18n() {
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("#btn-lang").textContent = state.lang === "zh" ? "EN" : "中文";
  $("#codex-search").placeholder = t("searchPh");
}
function toast(msg) {
  const el = $("#toast"); el.textContent = msg;
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
function shuffle(a) { a = [...a]; for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ===================== MAP ===================== */
const NODE_POS = [
  [115,468],[248,415],[175,315],[318,258],[462,312],
  [575,225],[512,122],[678,142],[788,255],[712,408]
];
function heroPos() {
  const c = Math.min(state.chapter, 9);
  const frac = Math.min(state.level / 10, 1);
  const a = NODE_POS[c];
  const b = NODE_POS[Math.min(c+1, 9)];
  return [a[0] + (b[0]-a[0])*frac, a[1] + (b[1]-a[1])*frac];
}
function renderMap() {
  const [hx, hy] = heroPos();
  let path = "M " + NODE_POS.map(p => p.join(" ")).join(" L ");
  let nodes = "";
  CHAPTERS.forEach((ch, i) => {
    const [x, y] = NODE_POS[i];
    const done = i < state.chapter;
    const current = i === state.chapter;
    const fill = done ? "#8a6b2f" : current ? "#c49134" : "#b8a67c";
    const ring = current ? `<circle class="node-current-ring" cx="${x}" cy="${y}" r="27" fill="none" stroke="#9c2f2f" stroke-width="3"/>` : "";
    nodes += `
      <g class="map-node ${done||current ? "" : "locked"}" data-ch="${i}">
        ${ring}
        <circle cx="${x}" cy="${y}" r="24" fill="${fill}" stroke="#5a4526" stroke-width="3"/>
        <text class="icon" x="${x}" y="${y+7}" text-anchor="middle" font-size="22">${done ? "✅" : (done||current) ? ch.icon : "🔒"}</text>
        <text x="${x}" y="${y+44}" text-anchor="middle" font-size="13" fill="#5a4526" font-weight="bold">${["I","II","III","IV","V","VI","VII","VIII","IX","X"][i]}</text>
      </g>`;
  });
  $("#map-wrap").innerHTML = `
<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="parch" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#ecdcb2"/><stop offset="0.75" stop-color="#dfc794"/><stop offset="1" stop-color="#c3a76e"/>
    </radialGradient>
  </defs>
  <rect width="900" height="540" fill="url(#parch)"/>
  <g opacity=".12" fill="#5a4526">
    <ellipse cx="120" cy="90" rx="60" ry="22"/><ellipse cx="820" cy="470" rx="70" ry="26"/>
    <ellipse cx="760" cy="60" rx="40" ry="14"/><ellipse cx="80" cy="380" rx="34" ry="12"/>
  </g>
  <rect x="6" y="6" width="888" height="528" fill="none" stroke="#7a5c30" stroke-width="4" rx="10"/>
  <rect x="14" y="14" width="872" height="512" fill="none" stroke="#7a5c30" stroke-width="1.5" rx="7"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" fill="#5a4526" letter-spacing="6" font-style="italic">TABULA HEROIS · 英雄之路</text>
  <g opacity=".55" font-size="20">
    <text x="60" y="180">🌊</text><text x="840" y="160">🌊</text><text x="420" y="500">🌊</text>
    <text x="250" y="120">⛰️</text><text x="640" y="330">⛰️</text><text x="360" y="380">🌲</text><text x="820" y="360">🏛️</text>
  </g>
  <path d="${path}" fill="none" stroke="#8a5a2a" stroke-width="5" stroke-dasharray="2 11" stroke-linecap="round" opacity=".85"/>
  ${nodes}
  <g style="pointer-events:none">
    <circle cx="${hx}" cy="${hy-30}" r="17" fill="#fff8e0" stroke="#9c2f2f" stroke-width="2.5"/>
    <text x="${hx}" y="${hy-23}" text-anchor="middle" font-size="18">⚔️</text>
    <path d="M ${hx-6} ${hy-16} L ${hx} ${hy-6} L ${hx+6} ${hy-16} Z" fill="#9c2f2f"/>
  </g>
</svg>`;
  $("#map-wrap").querySelectorAll(".map-node").forEach(n => {
    n.addEventListener("click", () => {
      const i = +n.dataset.ch;
      if (i > state.chapter) { toast(t("locked")); return; }
      openChapter(i);
    });
  });
  $("#map-status").textContent = I18N[state.lang].mapStatus(state.chapter+1, Math.min(state.level+1,10));
  $("#map-legend").innerHTML = `<span>${t("legendDone")}</span><span>${t("legendCur")}</span><span>${t("legendLock")}</span>`;
  showScreen("screen-map");
}

/* ===================== CHAPTER ===================== */
let viewChapter = 0;
function openChapter(i) {
  viewChapter = i;
  const ch = CHAPTERS[i];
  $("#chapter-art").src = ch.art;
  $("#chapter-art-caption").textContent = L(ch.artCaption);
  $("#chapter-title").textContent = L(ch.name);
  $("#chapter-story").innerHTML = L(ch.story);
  const grid = $("#level-grid");
  grid.innerHTML = "";
  if (!ch.levels) {
    grid.innerHTML = `<div style="grid-column:1/-1;color:var(--text-dim);padding:20px;text-align:center">${t("building")}</div>`;
  } else {
    ch.levels.forEach((lv, li) => {
      const done = i < state.chapter || (i === state.chapter && li < state.level);
      const current = i === state.chapter && li === state.level;
      const b = document.createElement("button");
      b.className = "level-btn" + (done ? " done" : "") + (!done && !current ? " locked" : "") + (lv.boss ? " boss" : "");
      b.innerHTML = `<span class="lv-state">${done ? "✅" : current ? "⚔️" : "🔒"}</span> ${L(lv.name)}${lv.boss ? ` <span style="color:#c46a6a">· ${t("bossTag")}</span>` : ""}${done ? ` <span style="color:var(--text-dim);font-size:.85em">(${t("replayTag")})</span>` : ""}`;
      b.addEventListener("click", () => {
        if (!done && !current) { toast(t("locked")); return; }
        startQuiz(i, li, done);
      });
      grid.appendChild(b);
    });
  }
  showScreen("screen-chapter");
}

/* ===================== QUIZ ===================== */
let quiz = null; /* {chapter, level, replay, queue, locksTotal, locksOpen, wordSet} */
function startQuiz(ci, li, replay) {
  const ch = CHAPTERS[ci];
  const lv = ch.levels[li];
  const locksTotal = lv.boss ? 15 : 10;
  /* boss reviews whole chapter; normal level uses its own 20 words */
  let pool = lv.boss ? ch.levels.flatMap(l => l.words) : lv.words;
  let qWords = shuffle(pool).slice(0, locksTotal);
  quiz = { ci, li, replay, locksTotal, locksOpen: 0, queue: qWords, pool, lvWords: lv.words };
  $("#quiz-title").textContent = L(ch.name) + " — " + L(lv.name);
  const aw = $("#quiz-art-wrap");
  if (lv.art) {
    aw.style.display = "";
    $("#quiz-art").src = lv.art;
    $("#quiz-art-caption").textContent = L(lv.cap);
  } else { aw.style.display = "none"; }
  $("#quiz-story").innerHTML = L(lv.story);
  renderLocks();
  nextQuestion();
  showScreen("screen-quiz");
}
function renderLocks() {
  $("#locks").textContent = "🔓".repeat(quiz.locksOpen) + "🔒".repeat(quiz.locksTotal - quiz.locksOpen);
}
function wordMeaning(k) { const w = WORDS[k]; return state.lang === "zh" ? w[2] : w[3]; }
function nextQuestion() {
  if (quiz.locksOpen >= quiz.locksTotal) { finishQuiz(); return; }
  const key = quiz.queue[0];
  const w = WORDS[key];
  const heroMode = state.mode === "hero";
  const reverse = heroMode && Math.random() < 0.5;   /* meaning -> latin */
  const nOpts = heroMode ? 4 : 3;
  const distractors = shuffle(quiz.pool.filter(k => k !== key && wordMeaning(k) !== wordMeaning(key))).slice(0, nOpts - 1);
  const opts = shuffle([key, ...distractors]);
  $("#q-prompt-label").textContent = reverse ? t("q_m2la") : t("q_la2m");
  const qp = $("#q-prompt");
  if (reverse) { qp.className = "plain"; qp.textContent = WORDS[key][1] + " " + wordMeaning(key); }
  else { qp.className = ""; qp.textContent = w[0]; }
  const box = $("#q-options");
  box.innerHTML = "";
  $("#q-feedback").textContent = ""; $("#q-feedback").className = "";
  opts.forEach(k => {
    const ow = WORDS[k];
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.innerHTML = reverse
      ? `<i style="color:var(--accent)">${ow[0]}</i>`
      : `<span class="opt-emoji">${ow[1]}</span>${state.lang === "zh" ? ow[2] : ow[3]}`;
    b.addEventListener("click", () => answer(b, k === key, key));
    box.appendChild(b);
  });
}
function answer(btn, correct, key) {
  document.querySelectorAll(".opt-btn").forEach(b => b.disabled = true);
  const f = $("#q-feedback");
  if (correct) {
    btn.classList.add("correct");
    f.className = "good"; f.textContent = t("correct");
    quiz.locksOpen++; quiz.queue.shift();
    renderLocks();
    setTimeout(nextQuestion, 700);
  } else {
    btn.classList.add("wrong");
    const w = WORDS[key];
    f.className = "bad";
    f.textContent = t("wrong") + `  (${w[0]} = ${wordMeaning(key)})`;
    /* requeue: move to end */
    quiz.queue.push(quiz.queue.shift());
    setTimeout(nextQuestion, 1600);
  }
}
function finishQuiz() {
  const { ci, li, replay, lvWords } = quiz;
  const ch = CHAPTERS[ci];
  const lv = ch.levels[li];
  /* collect words */
  lvWords.forEach(k => { if (!state.words.includes(k)) state.words.push(k); });
  let chapterDone = false;
  if (!replay && ci === state.chapter && li === state.level) {
    state.level++;
    if (state.level >= ch.levels.length) { state.chapter++; state.level = 0; chapterDone = true; }
  }
  save();
  $("#victory-emoji").textContent = chapterDone ? "🏆" : "🎉";
  $("#victory-title").textContent = chapterDone ? t("chComplete") : t("lvComplete");
  $("#victory-text").innerHTML = (chapterDone ? L(ch.story) + "<br><br>" : "") + t("wordsGot");
  const vw = $("#victory-words");
  vw.innerHTML = "";
  lvWords.forEach(k => {
    const w = WORDS[k];
    const s = document.createElement("span");
    s.className = "word-tag";
    s.innerHTML = `${w[1]} <i>${w[0]}</i> ${state.lang === "zh" ? w[2] : w[3]}`;
    vw.appendChild(s);
  });
  const btn = $("#btn-victory-next");
  if (chapterDone) { btn.textContent = t("backMapBtn"); btn.onclick = renderMap; }
  else if (!replay) { btn.textContent = t("nextLevel"); btn.onclick = () => { openChapter(state.chapter); }; }
  else { btn.textContent = t("backChapter"); btn.onclick = () => openChapter(ci); }
  showScreen("screen-victory");
}

/* ===================== CODEX ===================== */
function renderCodex() {
  const grid = $("#codex-grid");
  const query = $("#codex-search").value.trim().toLowerCase();
  grid.innerHTML = "";
  let owned = 0;
  const TOTAL_TARGET = 2000;
  Object.keys(WORDS).forEach(key => {
    const w = WORDS[key];
    const has = state.words.includes(key);
    if (has) owned++;
    if (query && !(w[0].toLowerCase().includes(query) || w[2].includes(query) || w[3].toLowerCase().includes(query))) return;
    const card = document.createElement("div");
    card.className = "codex-card" + (has ? "" : " locked");
    card.innerHTML = has
      ? `<div class="emoji">${w[1]}</div><div class="latin">${w[0]}</div>
         <div class="meaning">${state.lang === "zh" ? w[2] : w[3]}</div>
         ${w[4] ? `<div class="deriv">→ ${w[4]}</div>` : ""}`
      : `<div class="emoji">❔</div><div class="latin">?????</div><div class="meaning">&nbsp;</div>`;
    grid.appendChild(card);
  });
  $("#codex-count").textContent = `${owned} / ${Object.keys(WORDS).length} (${state.lang==="zh"?"目标":"target"} ${TOTAL_TARGET})`;
  showScreen("screen-codex");
}

/* ===================== WIRE ===================== */
$("#btn-lang").addEventListener("click", () => {
  state.lang = state.lang === "zh" ? "en" : "zh"; save(); applyI18n();
  const shown = document.querySelector(".screen.show");
  if (shown) {
    if (shown.id === "screen-map") renderMap();
    else if (shown.id === "screen-codex") renderCodex();
    else if (shown.id === "screen-chapter") openChapter(viewChapter);
  }
});
$("#btn-map").addEventListener("click", () => { if (state.mode) renderMap(); else showScreen("screen-mode"); });
$("#btn-codex").addEventListener("click", renderCodex);
$("#btn-title").addEventListener("click", () => showScreen("screen-title"));
$("#btn-start").addEventListener("click", () => { if (state.mode) renderMap(); else showScreen("screen-mode"); });
$("#btn-reset").addEventListener("click", () => {
  if (confirm(t("confirmReset"))) {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    state = { lang: state.lang, mode: null, chapter: 0, level: 0, words: [] };
    showScreen("screen-title");
  }
});
document.querySelectorAll(".mode-card").forEach(c => {
  c.addEventListener("click", () => { state.mode = c.dataset.mode; save(); renderMap(); });
});
$("#btn-back-map").addEventListener("click", renderMap);
$("#btn-quit-quiz").addEventListener("click", () => openChapter(quiz ? quiz.ci : state.chapter));
$("#codex-search").addEventListener("input", renderCodex);

load();
applyI18n();
showScreen("screen-title");
</script>
</body>
</html>
