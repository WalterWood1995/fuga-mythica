<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuga Mythica — 神话密室逃脱</title>
<style>
  :root {
    --bg: #1a1626;
    --panel: #2a2440;
    --panel2: #352d52;
    --gold: #e8b64c;
    --gold-dim: #a8842e;
    --text: #f0e9d8;
    --text-dim: #b0a890;
    --accent: #7ec8e3;
    --good: #7ede8a;
    --bad: #e37e7e;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Georgia", "Songti SC", "SimSun", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #app { width: 100%; max-width: 900px; padding: 12px; }

  /* ---------- top bar ---------- */
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 4px; gap: 8px; flex-wrap: wrap;
  }
  #topbar .title { font-size: 1.1em; color: var(--gold); letter-spacing: 2px; }
  .pill {
    background: var(--panel); border: 1px solid var(--gold-dim);
    color: var(--text); border-radius: 20px; padding: 5px 14px;
    cursor: pointer; font-size: 0.9em; font-family: inherit;
  }
  .pill:hover { background: var(--panel2); }
  .pill.active { background: var(--gold); color: #221; border-color: var(--gold); }

  /* ---------- screens ---------- */
  .screen { display: none; animation: fadein .4s; }
  .screen.show { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  /* ---------- title screen ---------- */
  #screen-title { text-align: center; padding: 40px 10px; }
  #screen-title h1 {
    font-size: 2.6em; color: var(--gold); letter-spacing: 6px; margin-bottom: 6px;
    text-shadow: 0 0 30px rgba(232,182,76,.35);
  }
  #screen-title .subtitle { color: var(--text-dim); margin-bottom: 30px; font-size: 1.1em; }
  .big-btn {
    display: inline-block; background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    color: #221; font-size: 1.2em; padding: 14px 44px; border-radius: 30px;
    border: none; cursor: pointer; font-family: inherit; letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(232,182,76,.3); margin: 8px;
  }
  .big-btn:hover { transform: translateY(-2px); }
  .big-btn.secondary { background: var(--panel2); color: var(--text); box-shadow: none; border: 1px solid var(--gold-dim); }

  /* ---------- mode select ---------- */
  .mode-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .mode-card {
    background: var(--panel); border: 2px solid var(--gold-dim); border-radius: var(--radius);
    padding: 24px; width: 260px; cursor: pointer; text-align: center;
  }
  .mode-card:hover { border-color: var(--gold); background: var(--panel2); transform: translateY(-3px); }
  .mode-card .emoji { font-size: 3em; }
  .mode-card h3 { color: var(--gold); margin: 10px 0 6px; }
  .mode-card p { color: var(--text-dim); font-size: 0.9em; line-height: 1.5; }

  /* ---------- scene ---------- */
  #scene-header { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 10px; flex-wrap: wrap; gap: 6px;}
  #scene-name { color: var(--gold); font-size: 1.3em; letter-spacing: 2px; }
  #scene-progress { color: var(--text-dim); font-size: 0.9em; }
  #scene-wrap {
    position: relative; border-radius: var(--radius); overflow: hidden;
    border: 2px solid var(--gold-dim); background: #000;
  }
  #scene-svg-holder svg { display: block; width: 100%; height: auto; }
  .hotspot { cursor: pointer; }
  .hotspot:hover .glow { opacity: 1; }
  .glow { opacity: 0; transition: opacity .25s; }
  .hotspot.solved { cursor: default; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .8; } }
  .hint-pulse { animation: pulse 2s infinite; }

  #narration {
    background: var(--panel); border-left: 4px solid var(--gold);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 14px 18px; margin-top: 12px; line-height: 1.7; min-height: 60px;
  }
  #narration .latin { color: var(--accent); font-style: italic; }

  /* ---------- puzzle modal ---------- */
  #modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(10,8,18,.8);
    z-index: 50; justify-content: center; align-items: center; padding: 14px;
  }
  #modal-mask.show { display: flex; }
  #modal {
    background: var(--panel); border: 2px solid var(--gold); border-radius: var(--radius);
    max-width: 560px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto;
    animation: fadein .3s;
  }
  #modal h3 { color: var(--gold); margin-bottom: 4px; letter-spacing: 1px; }
  #modal .puzzle-latin { font-size: 1.5em; color: var(--accent); font-style: italic; margin: 10px 0; text-align: center; }
  #modal .puzzle-question { line-height: 1.6; margin-bottom: 16px; }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .opt-btn {
    background: var(--panel2); border: 2px solid var(--gold-dim); color: var(--text);
    border-radius: 10px; padding: 14px 10px; font-size: 1.05em; cursor: pointer;
    font-family: inherit; text-align: center; line-height: 1.4;
  }
  .opt-btn .opt-emoji { font-size: 1.8em; display: block; }
  .opt-btn:hover { border-color: var(--gold); background: #40376a; }
  .opt-btn.correct { border-color: var(--good); background: rgba(126,222,138,.15); }
  .opt-btn.wrong { border-color: var(--bad); background: rgba(227,126,126,.15); animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  #modal .feedback { min-height: 28px; margin-top: 14px; text-align: center; font-size: 1.05em; }
  #modal .feedback.good { color: var(--good); }
  #modal .feedback.bad { color: var(--bad); }
  #modal-buttons { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; flex-wrap: wrap; }
  .word-order-area { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; min-height: 54px;
    border: 1px dashed var(--gold-dim); border-radius: 10px; padding: 8px; }
  .chip {
    background: var(--gold); color: #221; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 1.1em; cursor: pointer; font-family: inherit;
  }
  .chip.pool { background: var(--panel2); color: var(--text); border: 1px solid var(--gold-dim); }

  /* ---------- word reward toast ---------- */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #221; padding: 12px 26px; border-radius: 30px;
    font-size: 1.05em; z-index: 90; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  #toast.show { display: block; animation: toastup 2.6s forwards; }
  @keyframes toastup {
    0% { opacity: 0; transform: translate(-50%, 20px); }
    12% { opacity: 1; transform: translate(-50%, 0); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- codex ---------- */
  #codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
  .codex-card {
    background: var(--panel); border: 1px solid var(--gold-dim); border-radius: var(--radius);
    padding: 14px; text-align: center;
  }
  .codex-card .emoji { font-size: 2.2em; }
  .codex-card .latin { color: var(--accent); font-size: 1.2em; font-style: italic; margin: 4px 0; }
  .codex-card .meaning { font-size: 0.95em; }
  .codex-card .deriv { color: var(--text-dim); font-size: 0.8em; margin-top: 6px; line-height: 1.4; }
  .codex-card.locked { opacity: .35; filter: grayscale(1); }
  .codex-card.locked .latin { color: var(--text-dim); }

  /* ---------- chapter complete ---------- */
  #screen-victory { text-align: center; padding: 40px 10px; }
  #screen-victory h2 { color: var(--gold); font-size: 2em; margin-bottom: 12px; }
  #screen-victory p { color: var(--text-dim); margin-bottom: 20px; line-height: 1.7; }

  .backlink { color: var(--text-dim); cursor: pointer; text-decoration: underline; font-size: .9em; }
  footer { color: #555; font-size: .75em; padding: 18px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title">⚱ FUGA MYTHICA</span>
    <span>
      <button class="pill" id="btn-lang">EN</button>
      <button class="pill" id="btn-codex">📖 <span data-t="codex">词汇册</span></button>
      <button class="pill" id="btn-home">🏛 <span data-t="home">主页</span></button>
    </span>
  </div>

  <!-- Title -->
  <div class="screen" id="screen-title">
    <h1>FUGA MYTHICA</h1>
    <div class="subtitle" data-t="tagline">希腊神话密室逃脱 · 在冒险中学拉丁语</div>
    <button class="big-btn" id="btn-start" data-t="start">开始冒险</button>
    <div style="margin-top:10px"><span class="backlink" id="btn-reset" data-t="reset">清除进度重新开始</span></div>
  </div>

  <!-- Mode select -->
  <div class="screen" id="screen-mode">
    <h2 style="text-align:center;color:var(--gold);margin-top:20px" data-t="choosemode">选择你的身份</h2>
    <div class="mode-cards">
      <div class="mode-card" data-mode="apprentice">
        <div class="emoji">🐣</div>
        <h3 data-t="apprentice">学徒 Discipulus</h3>
        <p data-t="apprenticedesc">适合 6–8 岁:看图选词,提示多多,轻松闯关。</p>
      </div>
      <div class="mode-card" data-mode="hero">
        <div class="emoji">⚔️</div>
        <h3 data-t="hero">英雄 Heros</h3>
        <p data-t="herodesc">适合 9–12 岁:翻译短句、推理词根,挑战更烧脑的谜题。</p>
      </div>
    </div>
  </div>

  <!-- Scene -->
  <div class="screen" id="screen-scene">
    <div id="scene-header">
      <span id="scene-name"></span>
      <span id="scene-progress"></span>
    </div>
    <div id="scene-wrap"><div id="scene-svg-holder"></div></div>
    <div id="narration"></div>
  </div>

  <!-- Codex -->
  <div class="screen" id="screen-codex">
    <h2 style="color:var(--gold);margin-top:10px">📖 <span data-t="codextitle">词汇册 Codex Verborum</span></h2>
    <p style="color:var(--text-dim);margin-top:6px" data-t="codexdesc">你收集到的每一个拉丁词都记录在这里。</p>
    <div id="codex-grid"></div>
  </div>

  <!-- Victory -->
  <div class="screen" id="screen-victory">
    <div style="font-size:4em">🏆</div>
    <h2 data-t="victory">恭喜逃脱!</h2>
    <p id="victory-text"></p>
    <button class="big-btn" id="btn-victory-next"></button>
  </div>
</div>

<!-- Puzzle modal -->
<div id="modal-mask">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <div class="puzzle-latin" id="modal-latin"></div>
    <div class="puzzle-question" id="modal-question"></div>
    <div id="modal-body"></div>
    <div class="feedback" id="modal-feedback"></div>
    <div id="modal-buttons">
      <button class="pill" id="btn-hint">💡 <span data-t="hint">提示</span></button>
      <button class="pill" id="btn-close" data-t="close">关闭</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<footer>Fuga Mythica · demo v0.1</footer>

/* =====================================================
   STATE
===================================================== */
const SAVE_KEY = "fuga-mythica-save-v1";
let state = {
  lang: "zh",
  mode: null,          // "apprentice" | "hero"
  chapter: 0,
  solved: {},          // hotspotId -> true
  words: [],           // collected word keys
};
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === "object") state = Object.assign(state, s);
  } catch (e) {}
}
function t(key) { return I18N[state.lang][key] || key; }
function L(obj) { return obj[state.lang] || obj.zh; }

/* =====================================================
   UI helpers
===================================================== */
const $ = sel => document.querySelector(sel);
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("show"));
  $("#" + id).classList.add("show");
}
function applyI18n() {
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $("#btn-lang").textContent = state.lang === "zh" ? "EN" : "中文";
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}

/* =====================================================
   Scene rendering
===================================================== */
function renderScene() {
  const ch = CHAPTERS[state.chapter];
  $("#scene-name").textContent = L(ch.name);
  const solvedCount = ch.puzzles.filter(p => state.solved[p.hotspot]).length;
  $("#scene-progress").textContent = `${t("puzzleOf")}: ${solvedCount} / ${ch.puzzles.length} ${t("solvedLabel")}`;
  $("#scene-svg-holder").innerHTML = ch.svg;
  $("#narration").innerHTML = L(ch.intro);

  ch.puzzles.forEach(pz => {
    const el = document.getElementById(pz.hotspot);
    if (!el) return;
    if (state.solved[pz.hotspot]) {
      el.classList.add("solved");
      el.style.opacity = ".5";
      el.querySelectorAll(".glow").forEach(g => g.remove());
    } else {
      el.addEventListener("click", () => tryOpenPuzzle(pz));
    }
  });
  showScreen("screen-scene");
}

function tryOpenPuzzle(pz) {
  if (state.solved[pz.hotspot]) return;
  if (pz.requires) {
    const missing = pz.requires.filter(r => !state.solved[r]);
    if (missing.length) {
      $("#narration").innerHTML = state.lang === "zh"
        ? "🔒 这里还打不开——先解开房间里其他的谜题吧!"
        : "🔒 Not yet — solve the other puzzles in this room first!";
      return;
    }
  }
  openPuzzle(pz);
}

/* =====================================================
   Puzzle modal
===================================================== */
let currentPuzzle = null;
let orderState = [];

function openPuzzle(pz) {
  currentPuzzle = pz;
  const v = pz[state.mode] || pz.apprentice;
  $("#modal-title").textContent = L(pz.title);
  $("#modal-latin").textContent = v.latin || "";
  $("#modal-question").innerHTML = L(v.question);
  $("#modal-feedback").textContent = "";
  $("#modal-feedback").className = "feedback";
  const body = $("#modal-body");
  body.innerHTML = "";

  if (v.type === "choice") {
    const opts = [...v.options].sort(() => Math.random() - 0.5);
    const grid = document.createElement("div");
    grid.className = "options";
    opts.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt-btn";
      const label = o.showLatin ? o.zh : L(o);
      b.innerHTML = `<span class="opt-emoji">${o.emoji}</span>${o.showLatin ? `<i style="color:var(--accent)">${label}</i>` : label}`;
      b.addEventListener("click", () => {
        if (o.correct) { b.classList.add("correct"); solveCurrent(); }
        else { b.classList.add("wrong"); feedback(false); }
      });
      grid.appendChild(b);
    });
    body.appendChild(grid);
  } else if (v.type === "order") {
    orderState = [];
    const area = document.createElement("div");
    area.className = "word-order-area";
    area.id = "order-area";
    const pool = document.createElement("div");
    pool.className = "options";
    pool.id = "order-pool";
    pool.style.display = "flex";
    pool.style.justifyContent = "center";
    pool.style.flexWrap = "wrap";
    v.pool.forEach(word => {
      const c = document.createElement("button");
      c.className = "chip pool";
      c.textContent = word;
      c.addEventListener("click", () => {
        if (c.disabled) return;
        c.disabled = true; c.style.visibility = "hidden";
        orderState.push({ word, srcBtn: c });
        const placed = document.createElement("button");
        placed.className = "chip";
        placed.textContent = word;
        placed.addEventListener("click", () => {
          area.removeChild(placed);
          orderState = orderState.filter(x => x.srcBtn !== c);
          c.disabled = false; c.style.visibility = "visible";
        });
        area.appendChild(placed);
        if (orderState.length === v.answer.length) {
          const ok = orderState.every((x, i) => x.word === v.answer[i]);
          if (ok) solveCurrent();
          else feedback(false);
        }
      });
      pool.appendChild(c);
    });
    body.appendChild(area);
    body.appendChild(pool);
  }

  $("#btn-hint").onclick = () => {
    $("#modal-feedback").className = "feedback";
    $("#modal-feedback").innerHTML = "💡 " + L(v.hint);
  };
  $("#modal-mask").classList.add("show");
}

function feedback(good) {
  const f = $("#modal-feedback");
  f.className = "feedback " + (good ? "good" : "bad");
  f.textContent = good ? t("correct") : t("wrong");
}

function solveCurrent() {
  feedback(true);
  const pz = currentPuzzle;
  state.solved[pz.hotspot] = true;
  (pz.reward || []).forEach(w => {
    if (!state.words.includes(w)) state.words.push(w);
  });
  save();
  setTimeout(() => {
    $("#modal-mask").classList.remove("show");
    if (pz.reward && pz.reward.length) {
      const names = pz.reward.map(w => WORDS[w].latin).join(", ");
      toast(`📖 ${t("newword")} ${names}`);
    }
    const ch = CHAPTERS[state.chapter];
    const allSolved = ch.puzzles.every(p => state.solved[p.hotspot]);
    if (pz.opensExit && allSolved) {
      setTimeout(showVictory, 900);
    } else {
      renderScene();
      $("#narration").innerHTML = L(ch.intro);
    }
  }, 900);
}

/* =====================================================
   Victory / chapter transition
===================================================== */
function showVictory() {
  const ch = CHAPTERS[state.chapter];
  $("#victory-text").innerHTML = L(ch.outro);
  const btn = $("#btn-victory-next");
  const hasNext = state.chapter < CHAPTERS.length - 1;
  btn.textContent = hasNext ? t("nextChapter") : t("replay");
  btn.onclick = () => {
    if (hasNext) {
      state.chapter++;
      save();
      renderScene();
    } else {
      $("#victory-text").innerHTML = L(ch.outro) + "<br><br>" + t("toBeContinued");
      showScreen("screen-title");
    }
  };
  if (!hasNext) $("#victory-text").innerHTML = L(ch.outro) + "<br><br><b>" + t("toBeContinued") + "</b>";
  showScreen("screen-victory");
}

/* =====================================================
   Codex
===================================================== */
function renderCodex() {
  const grid = $("#codex-grid");
  grid.innerHTML = "";
  Object.keys(WORDS).forEach(key => {
    const w = WORDS[key];
    const owned = state.words.includes(key);
    const card = document.createElement("div");
    card.className = "codex-card" + (owned ? "" : " locked");
    card.innerHTML = owned
      ? `<div class="emoji">${w.emoji}</div>
         <div class="latin">${w.latin}</div>
         <div class="meaning">${state.lang === "zh" ? w.zh : w.en}</div>
         <div class="deriv">→ ${w.deriv}</div>`
      : `<div class="emoji">❔</div><div class="latin">?????</div><div class="meaning">&nbsp;</div>`;
    grid.appendChild(card);
  });
  showScreen("screen-codex");
}

/* =====================================================
   Wire up
===================================================== */
$("#btn-lang").addEventListener("click", () => {
  state.lang = state.lang === "zh" ? "en" : "zh";
  save(); applyI18n();
  const shown = document.querySelector(".screen.show");
  if (shown && shown.id === "screen-scene") renderScene();
  if (shown && shown.id === "screen-codex") renderCodex();
});
$("#btn-codex").addEventListener("click", renderCodex);
$("#btn-home").addEventListener("click", () => showScreen("screen-title"));
$("#btn-start").addEventListener("click", () => {
  if (state.mode) renderScene();
  else showScreen("screen-mode");
});
$("#btn-reset").addEventListener("click", () => {
  if (confirm(t("confirmReset"))) {
    localStorage.removeItem(SAVE_KEY);
    state = { lang: state.lang, mode: null, chapter: 0, solved: {}, words: [] };
    showScreen("screen-title");
  }
});
document.querySelectorAll(".mode-card").forEach(c => {
  c.addEventListener("click", () => {
    state.mode = c.dataset.mode;
    save();
    renderScene();
  });
});
$("#btn-close").addEventListener("click", () => $("#modal-mask").classList.remove("show"));
$("#modal-mask").addEventListener("click", e => {
  if (e.target === $("#modal-mask")) $("#modal-mask").classList.remove("show");
});

/* init */
load();
applyI18n();
showScreen("screen-title");
</script>
</body>
</html>
